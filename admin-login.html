<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Login | RTLWE263</title>
    <meta name="description" content="Login to the RTLWE263 admin dashboard." />
    <link rel="icon" href="assets/london-west-end-logo.png" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" href="assets/london-west-end-logo.png" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .admin-login-main {
        padding: 4rem 0;
      }

      .admin-login-box {
        max-width: 520px;
        margin: 0 auto;
      }

      .admin-login-header {
        text-align: center;
        margin-bottom: 1.4rem;
      }

      .admin-login-logo {
        width: 90px;
        height: 90px;
        object-fit: contain;
      }

      .admin-login-intro {
        margin-bottom: 1.5rem;
        color: var(--muted);
        line-height: 1.6;
      }

      .admin-login-form {
        display: grid;
        gap: 1rem;
      }

      .admin-login-field {
        display: grid;
        gap: 0.5rem;
      }

      .admin-login-field label {
        font-weight: 500;
        color: var(--text);
        display: block;
      }

      .admin-login-field input {
        padding: 0.75rem;
        border: 1px solid rgba(220, 178, 108, 0.2);
        border-radius: 6px;
        background: rgba(19, 29, 43, 0.5);
        color: var(--text);
        font-family: Inter, system-ui, sans-serif;
        font-size: 1rem;
        transition: all 200ms ease;
      }

      .admin-login-field input:focus {
        outline: none;
        border-color: var(--gold);
        background: rgba(19, 29, 43, 0.8);
        box-shadow: 0 0 0 3px rgba(220, 178, 108, 0.1);
      }

      .admin-login-field input::placeholder {
        color: var(--muted);
      }

      .admin-login-button {
        margin-top: 0.5rem;
      }

      .admin-login-status {
        margin-top: 1.5rem;
        padding: 1rem;
        border-radius: 8px;
        font-size: 0.9rem;
        display: none;
        border-left: 4px solid transparent;
      }

      .admin-login-status--error {
        display: block;
        background: rgba(220, 100, 100, 0.15);
        color: #ff9999;
        border-left-color: #cc5555;
      }

      .admin-login-status--success {
        display: block;
        background: rgba(100, 200, 100, 0.15);
        color: #99ff99;
        border-left-color: #66cc66;
      }

      .admin-login-status--info {
        display: block;
        background: rgba(100, 150, 200, 0.15);
        color: #99ccff;
        border-left-color: #5588cc;
      }

      @media (max-width: 520px) {
        .admin-login-main {
          padding: 2rem 0;
        }

        .admin-login-box {
          padding: 0 1rem;
        }

        .admin-login-logo {
          width: 72px;
          height: 72px;
        }
      }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <main class="admin-login-main" id="main-content">
      <section class="admin-login-box section">
        <div class="admin-login-header">
          <img src="assets/london-west-end-logo.png" alt="Round Table London West End 623" class="admin-login-logo" />
        </div>
        <h1>Admin Login</h1>
        <p class="admin-login-intro">
          Sign in with your registered email address to access the content management dashboard. This keeps the CMS secure and separate from the public site.
        </p>
        <form id="admin-login-form" class="admin-login-form">
          <div class="admin-login-field">
            <label for="admin-email">Email Address</label>
            <input
              id="admin-email"
              type="email"
              name="email"
              required
              autocomplete="email"
              placeholder="london.westend@roundtable.org.uk"
              aria-describedby="email-help"
            />
          </div>
          <div class="admin-login-field">
            <label for="admin-password">Password</label>
            <input
              id="admin-password"
              type="password"
              name="password"
              required
              autocomplete="current-password"
              placeholder="Your secure password"
              aria-describedby="password-help"
            />
          </div>
          <button class="btn btn-primary admin-login-button" type="submit">Sign In</button>
        </form>
        <div
          id="login-status"
          class="admin-login-status"
          role="alert"
          aria-live="polite"
          aria-atomic="true"
        ></div>
        <div id="email-help" class="visually-hidden">Your registered admin email address</div>
        <div id="password-help" class="visually-hidden">Your secure password for admin access</div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="admin-login.js"></script>
  </body>
</html>
