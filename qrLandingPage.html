<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Round Table London West End visitor welcome page.">
  <meta name="theme-color" content="#071b33">
  <title>Welcome | Round Table London West End</title>
  <style>
    :root{--navy:#071b33;--gold:#d99a2b;--gold-dark:#b77913;--red:#a50f2d;--cream:#f7f3ec;--white:#fff;--ink:#18202a;--muted:#5f6770;--shadow:0 16px 42px rgba(7,27,51,.14);--radius:18px;--max-width:760px}
    *{box-sizing:border-box}html{min-height:100%;background:var(--cream)}body{min-height:100vh;margin:0;color:var(--ink);background:radial-gradient(circle at 10% 10%,rgba(217,154,43,.1),transparent 26rem),linear-gradient(180deg,#fff 0%,var(--cream) 100%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}button,a{font:inherit}.site-header{background:var(--navy);color:var(--white);border-bottom:3px solid var(--gold)}.header-inner{width:min(100% - 32px,1080px);min-height:84px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:13px;min-width:0}.brand-mark{width:54px;height:54px;flex:0 0 54px;border-radius:50%;overflow:hidden;background:var(--white);box-shadow:0 0 0 3px rgba(217,154,43,.95)}.brand-copy{min-width:0;line-height:1.08;text-transform:uppercase;letter-spacing:.04em}.brand-copy strong{display:block;color:var(--gold);font-size:clamp(1rem,2.5vw,1.35rem)}.brand-copy span{display:block;margin-top:4px;color:var(--white);font-size:clamp(.8rem,2vw,1rem)}.page-badge{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;color:var(--white);background:var(--red);font-weight:800;font-size:.88rem;white-space:nowrap}.page-badge svg{width:18px;height:18px}main{width:min(100% - 28px,var(--max-width));margin-inline:auto;padding:clamp(42px,7vw,72px) 0 32px}.eyebrow{margin:0 0 8px;color:var(--gold-dark);font-weight:800;letter-spacing:.02em}h1{max-width:680px;margin:0;color:var(--navy);font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.35rem,8vw,4.7rem);line-height:.98;letter-spacing:-.035em}.intro{max-width:640px;margin:24px 0 30px;color:var(--muted);font-size:clamp(1.04rem,2.4vw,1.25rem)}.choice-list{display:grid;gap:18px}.choice-card{width:100%;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;min-height:144px;padding:22px;border:1px solid rgba(7,27,51,.09);border-left:5px solid var(--gold);border-radius:var(--radius);color:var(--ink);background:rgba(255,255,255,.96);box-shadow:var(--shadow);text-align:left;cursor:pointer;transition:transform 160ms ease,box-shadow 160ms ease}.choice-card--public{border-left-color:var(--red)}.choice-card:hover{transform:translateY(-3px);box-shadow:0 20px 48px rgba(7,27,51,.18)}.choice-card:focus-visible{outline:4px solid rgba(217,154,43,.42);outline-offset:4px}.choice-card--public:focus-visible{outline-color:rgba(165,15,45,.34)}.choice-icon{width:68px;height:68px;display:grid;place-items:center;border-radius:50%;color:var(--gold);background:var(--navy)}.choice-card--public .choice-icon{background:var(--red)}.choice-icon svg{width:38px;height:38px}.choice-copy strong{display:block;margin-bottom:4px;color:var(--navy);font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.45rem,4vw,2rem);line-height:1.15}.choice-copy span{display:block;color:var(--muted);font-size:1rem}.choice-arrow{color:var(--gold-dark);font-size:2.4rem;line-height:1;transform:translateY(-2px)}.redirect-note{display:flex;align-items:center;justify-content:center;gap:8px;margin:24px 0 0;color:var(--muted);font-size:.92rem;text-align:center}.redirect-note svg{width:18px;height:18px;flex:0 0 auto}.footer-message{position:relative;margin-top:42px;padding-top:26px;color:var(--navy);text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:1.05rem;font-weight:700}.footer-message:before{content:"";position:absolute;top:0;left:50%;width:min(100%,430px);height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);transform:translateX(-50%)}.status-message{min-height:1.5em;margin:16px 0 0;color:var(--navy);text-align:center;font-weight:700}.noscript{width:min(100% - 28px,var(--max-width));margin:18px auto 0;padding:14px 16px;border:1px solid #d3a50e;border-radius:10px;color:#4f3d00;background:#fff7cc}@media(max-width:620px){.header-inner{min-height:76px}.brand-mark{width:46px;height:46px;flex-basis:46px}.page-badge{padding:9px 11px;font-size:.75rem}.page-badge span{display:none}.choice-card{min-height:126px;gap:14px;padding:18px 16px}.choice-icon{width:56px;height:56px}.choice-icon svg{width:31px;height:31px}.choice-copy span{font-size:.92rem}}@media(max-width:410px){.choice-card{grid-template-columns:1fr auto}.choice-icon{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand" aria-label="Round Table London West End">
        <!-- Placeholder mark: replace with the approved official logo before launch. -->
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#fff"/><circle cx="50" cy="50" r="40" fill="#071b33"/><circle cx="50" cy="50" r="13" fill="#a50f2d" stroke="#d99a2b" stroke-width="4"/><g stroke="#d99a2b" stroke-width="5"><line x1="50" y1="10" x2="50" y2="37"/><line x1="50" y1="63" x2="50" y2="90"/><line x1="10" y1="50" x2="37" y2="50"/><line x1="63" y1="50" x2="90" y2="50"/><line x1="22" y1="22" x2="41" y2="41"/><line x1="59" y1="59" x2="78" y2="78"/><line x1="78" y1="22" x2="59" y2="41"/><line x1="41" y1="59" x2="22" y2="78"/></g></svg>
        </div>
        <div class="brand-copy"><strong>Round Table</strong><span>London West End</span></div>
      </div>
      <div class="page-badge" aria-label="QR welcome page">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4h6v6H4V4Zm10 0h6v6h-6V4ZM4 14h6v6H4v-6Zm11 0h2v2h-2v-2Zm3 0h2v4h-2v-4Zm-4 4h4v2h-4v-2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>QR Welcome Page</span>
      </div>
    </div>
  </header>

  <noscript><div class="noscript">JavaScript is required for the selection buttons. The developer can replace them with ordinary links if a script-free version is preferred.</div></noscript>

  <main>
    <p class="eyebrow">Welcome</p>
    <h1>Round Table<br>London West End</h1>
    <p class="intro">You've scanned the pub QR code. Tell us who you are and we'll point you in the right direction.</p>

    <section class="choice-list" aria-label="Choose the option that describes you">
      <button class="choice-card" type="button" data-route="tabler">
        <span class="choice-icon" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="15" r="6" stroke="currentColor" stroke-width="2.5"/><circle cx="11" cy="18" r="4.5" stroke="currentColor" stroke-width="2.5"/><circle cx="37" cy="18" r="4.5" stroke="currentColor" stroke-width="2.5"/><path d="M14 39v-6c0-5.5 4.5-10 10-10s10 4.5 10 10v6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M3 38v-4c0-4.4 3.6-8 8-8 2 0 3.9.7 5.3 2M45 38v-4c0-4.4-3.6-8-8-8-2 0-3.9.7-5.3 2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></span>
        <span class="choice-copy"><strong>I'm a Tabler</strong><span>Already part of Round Table? Head to our visitor log and get in touch.</span></span>
        <span class="choice-arrow" aria-hidden="true">›</span>
      </button>

      <button class="choice-card choice-card--public" type="button" data-route="curious">
        <span class="choice-icon" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="18" stroke="currentColor" stroke-width="2.5"/><path d="m29.5 18.5-4 9-9 4 4-9 9-4Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><circle cx="24" cy="24" r="2" fill="currentColor"/></svg></span>
        <span class="choice-copy"><strong>I'm Curious</strong><span>New here? Learn what Round Table is, what we do, and how to get involved.</span></span>
        <span class="choice-arrow" aria-hidden="true">›</span>
      </button>
    </section>

    <p class="redirect-note"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 10.5V17M12 7.2h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>You'll be redirected after selecting an option.</p>
    <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
    <footer class="footer-message">Friendly faces. New connections. Good causes.</footer>
  </main>

  <script>
    // Routes configured for production
    const ROUTES = Object.freeze({
      tabler: "/#guestbook-form",
      curious: "/#about"
    });

    const statusMessage = document.getElementById("status-message");
    document.querySelectorAll("[data-route]").forEach((button) => {
      button.addEventListener("click", () => {
        const destination = ROUTES[button.dataset.route];
        if (!destination) {
          statusMessage.textContent = "Error: Route not configured.";
          return;
        }
        statusMessage.textContent = "Taking you to the right place…";
        window.location.assign(destination);
      });
    });
  </script>
</body>
</html>
