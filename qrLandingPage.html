<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Round Table London West End visitor welcome page." />
  <meta name="theme-color" content="#0b1018" />
  <title>Welcome | Round Table London West End 623</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .qr-page-header {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      padding: 1.5rem;
      border-bottom: 1px solid rgba(220, 178, 108, 0.2);
    }

    .qr-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      text-align: center;
    }

    .qr-brand-logo {
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .qr-brand-copy {
      line-height: 1.1;
    }

    .qr-brand-copy h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--gold);
      font-family: 'Playfair Display', serif;
    }

    .qr-brand-copy p {
      margin: 0.25rem 0 0;
      font-size: 0.85rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .qr-main {
      width: min(100% - 2rem, 640px);
      margin: 0 auto;
      padding: 3rem 1rem;
    }

    .qr-intro {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .qr-intro p {
      margin: 0;
      color: var(--muted);
      font-size: 1.1rem;
    }

    .qr-choices {
      display: grid;
      gap: 1rem;
    }

    .qr-choice-btn {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 1.5rem;
      padding: 2rem;
      border: 1px solid rgba(220, 178, 108, 0.2);
      border-left: 4px solid var(--gold);
      border-radius: 12px;
      background: rgba(19, 29, 43, 0.6);
      color: inherit;
      cursor: pointer;
      text-align: left;
      font-size: 1rem;
      transition: all 200ms ease;
    }

    .qr-choice-btn:hover {
      background: rgba(19, 29, 43, 0.9);
      border-left-color: var(--gold);
      transform: translateX(4px);
    }

    .qr-choice-btn:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .qr-choice-icon {
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(220, 178, 108, 0.15);
      color: var(--gold);
      flex-shrink: 0;
    }

    .qr-choice-icon svg {
      width: 32px;
      height: 32px;
      stroke-width: 2;
      fill: none;
      stroke: currentColor;
    }

    .qr-choice-copy {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .qr-choice-copy strong {
      font-size: 1.3rem;
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      color: var(--text);
      margin: 0;
    }

    .qr-choice-copy span {
      font-size: 0.95rem;
      color: var(--muted);
      margin: 0;
    }

    .qr-footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(220, 178, 108, 0.1);
      color: var(--muted);
      font-size: 0.9rem;
    }

    .qr-status {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--gold);
      font-weight: 500;
      min-height: 1.5rem;
    }

    @media (max-width: 520px) {
      .qr-page-header {
        min-height: 100px;
        padding: 1rem;
      }

      .qr-brand-logo {
        width: 64px;
        height: 64px;
      }

      .qr-brand-copy h1 {
        font-size: 1.3rem;
      }

      .qr-main {
        padding: 2rem 1rem;
      }

      .qr-choice-btn {
        grid-template-columns: 1fr;
        padding: 1.5rem;
        gap: 1rem;
      }

      .qr-choice-icon {
        width: 48px;
        height: 48px;
      }

      .qr-choice-icon svg {
        width: 28px;
        height: 28px;
      }

      .qr-choice-copy strong {
        font-size: 1.1rem;
      }

      .qr-choice-copy span {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <header class="qr-page-header">
    <div class="qr-brand">
      <div class="qr-brand-logo">
        <img src="assets/london-west-end-logo.png" alt="Round Table London West End 623" width="80" height="80" />
      </div>
      <div class="qr-brand-copy">
        <h1>London West End 623</h1>
        <p>Round Table</p>
      </div>
    </div>
  </header>

  <main class="qr-main">
    <section class="qr-intro">
      <p>You've scanned our pub QR code. Tell us who you are and we'll point you in the right direction.</p>
    </section>

    <section class="qr-choices">
      <button class="qr-choice-btn" type="button" data-route="tabler" aria-label="I'm already a Tabler">
        <span class="qr-choice-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <circle cx="24" cy="15" r="6" />
            <circle cx="11" cy="18" r="4.5" />
            <circle cx="37" cy="18" r="4.5" />
            <path d="M14 39v-6c0-5.5 4.5-10 10-10s10 4.5 10 10v6" stroke-linecap="round" />
            <path d="M3 38v-4c0-4.4 3.6-8 8-8 2 0 3.9.7 5.3 2M45 38v-4c0-4.4-3.6-8-8-8-2 0-3.9.7-5.3 2" stroke-linecap="round" />
          </svg>
        </span>
        <div class="qr-choice-copy">
          <strong>I'm a Tabler</strong>
          <span>Member? Sign our visiting book and connect with the table.</span>
        </div>
      </button>

      <button class="qr-choice-btn" type="button" data-route="curious" aria-label="I'm new and curious">
        <span class="qr-choice-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="18" />
            <path d="m29.5 18.5-4 9-9 4 4-9 9-4Z" stroke-linejoin="round" />
            <circle cx="24" cy="24" r="2" fill="currentColor" />
          </svg>
        </span>
        <div class="qr-choice-copy">
          <strong>I'm Curious</strong>
          <span>New here? Learn what Round Table is and how to get involved.</span>
        </div>
      </button>
    </section>

    <p id="qr-status" class="qr-status" role="status" aria-live="polite"></p>
  </main>

  <footer class="qr-footer">
    <p>Friendly faces. New connections. Good causes.</p>
  </footer>

  <script>
    const ROUTES = Object.freeze({
      tabler: "/#guestbook-form",
      curious: "/#about"
    });

    const statusEl = document.getElementById("qr-status");

    document.querySelectorAll("[data-route]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const dest = ROUTES[btn.dataset.route];
        if (dest) {
          statusEl.textContent = "Taking you there…";
          setTimeout(() => window.location.assign(dest), 300);
        }
      });
    });
  </script>
</body>
</html>
